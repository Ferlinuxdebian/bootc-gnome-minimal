name: Build e Push da Imagem Bootc
on:
  schedule:
    - cron: '0 10 * * *'
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ferlinuxdebian/bootc-gnome-minimal
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      # Remove o entulho do GitHub e joga o Podman para o disco gigante (/mnt)
      - name: Liberar Espaço Máximo e Configurar Podman
        run: |
          echo "=== Removendo arquivos inúteis do runner ==="
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/libexec/docker
          
          echo "=== Criando estrutura no disco secundário (/mnt) ==="
          sudo mkdir -p /mnt/podman /mnt/tmp
          sudo chmod 777 /mnt/podman /mnt/tmp
          
          echo "=== Apagando dados antigos do Podman ==="
          sudo rm -rf /var/lib/containers
          
          echo "=== Criando link simbólico para desviar o espaço do Podman ==="
          sudo ln -s /mnt/podman /var/lib/containers
          
          echo "=== Redirecionando pastas temporárias do sistema ==="
          export TMPDIR=/mnt/tmp
          export O_TMPDIR=/mnt/tmp
          
          echo "=== Verificação de espaço inicial ==="
          df -h

      - name: Gerar metadados do build
        id: meta
        run: |
          VERSION=$(grep '^FROM' Containerfile | head -n 1 | awk -F: '{print $2}' | awk '{print $1}')
          DATE=$(TZ='America/Sao_Paulo' date +'%Y%m%d-%H%M')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          PRIMARY="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}-${DATE}"
          echo "version=${VERSION}"     >> $GITHUB_OUTPUT
          echo "date=${DATE}"           >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "primary=${PRIMARY}"     >> $GITHUB_OUTPUT

      - name: Login GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login \
            -u "${{ github.actor }}" --password-stdin "${{ env.REGISTRY }}"

      - name: Build Podman
        run: |
          export TMPDIR=/mnt/tmp
          sudo -E podman build \
            --no-cache \
            --rm \
            --skip-unused-stages=false \
            --security-opt label=disable \
            -t "localhost/bootc-raw:latest" \
            -f Containerfile \
            -v "$(pwd):/run/src" \
            .

      - name: Rechunk Bootc
        run: |
          export TMPDIR=/mnt/tmp
          sudo -E podman run --rm --privileged \
            -v /var/lib/containers:/var/lib/containers \
            quay.io/fedora/fedora-bootc:44 \
            /usr/libexec/bootc-base-imagectl rechunk \
            localhost/bootc-raw:latest \
            "${{ steps.meta.outputs.primary }}"

      - name: Push Principal
        run: sudo podman push "${{ steps.meta.outputs.primary }}"

      - name: Tags Skopeo
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          SHORT_SHA="${{ steps.meta.outputs.short_sha }}"
          BASE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          CREDS="${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}"
          for TAG in "${VERSION}-latest" "latest" "main" "sha-${SHORT_SHA}"; do
            sudo skopeo copy --src-creds "${CREDS}" --dest-creds "${CREDS}" \
              "docker://${{ steps.meta.outputs.primary }}" "docker://${BASE}:${TAG}"
          done
      
      - name: Debug OOM
        if: failure()
        run: dmesg | grep -i "killed process" || journalctl -k --no-pager | grep -i oom