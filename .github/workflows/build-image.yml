name: Build e Push da Imagem Bootc
on:
  schedule:
    - cron: '0 5 * * *'
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ferlinuxdebian/bootc-gnome-minimal
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            "/usr/local/share/boost" "$AGENT_TOOLSDIRECTORY"

      - name: Obter a versão da imagem base para metadados
        id: base_version
        run: |
          VERSION=$(grep '^FROM' Containerfile | head -n 1 | awk -F: '{print $2}' | awk '{print $1}')
          DATE=$(TZ='America/Sao_Paulo' date +'%Y%m%d-%H%M')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "date=${DATE}" >> $GITHUB_OUTPUT

      # CONFIGURAÇÃO DO BUILDX: Inicializa o ambiente do Docker BuildKit com suporte a cache remoto gha
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR (Docker)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GERENCIADOR DE TAGS: Substitui o script skopeo de forma nativa e limpa
      - name: Configurar tags e metadados da imagem
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.base_version.outputs.version }}-${{ steps.base_version.outputs.date }}
            type=raw,value=${{ steps.base_version.outputs.version }}-latest
            type=raw,value=latest
            type=raw,value=main
            type=sha,prefix=sha-,format=short

      # BUILD E PUSH UNIFICADO COM CACHE INTELIGENTE (GHA)
      - name: Build e Push com Cache Remoto GHA
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          # MÁGICA DO CACHE: Salva o estado de todas as camadas (incluindo Chunkah) no cache do GitHub Actions
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notificar no Telegram
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ${{ job.status == 'success' && '✅ Rebuild Concluído via Buildx!' || '❌ Erro no Rebuild via Buildx!' }}
            📦 Base: ${{ steps.base_version.outputs.version }}
            🏷️ Tag Primária: ${{ steps.base_version.outputs.version }}-${{ steps.base_version.outputs.date }}
            🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
